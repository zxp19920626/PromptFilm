spring:
  application:
    name: prompt-film-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: always
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /openapi.json
  swagger-ui:
    path: /docs

app:
  environment: ${APP_ENV:local}
  jwt-secret: ${JWT_SECRET}
  wan:
    base-url: ${WAN_BASE_URL:}
    api-key: ${DASHSCOPE_API_KEY:}
    text-model: ${WAN_TEXT_MODEL:wan2.7-t2v-2026-06-12}
    image-model: ${WAN_IMAGE_MODEL:wan2.7-i2v-2026-04-25}
    reference-model: ${WAN_REFERENCE_MODEL:wan2.7-r2v-2026-06-12}
    data-inspection: ${WAN_DATA_INSPECTION:}
