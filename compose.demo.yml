services:
  backend:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    image: promptfilm-backend:demo
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      SPRING_PROFILES_ACTIVE: demo
      APP_ENV: local-docker-demo
      SERVER_PORT: "18080"
      JWT_SECRET: demo-only-local-secret-change-me
      WAN_BASE_URL: ${WAN_BASE_URL:?请设置新加坡业务空间专属 WAN_BASE_URL}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?请设置新加坡业务空间 DASHSCOPE_API_KEY}
      WAN_TEXT_MODEL: wan2.7-t2v-2026-06-12
      WAN_IMAGE_MODEL: wan2.7-i2v-2026-04-25
      WAN_REFERENCE_MODEL: wan2.7-r2v-2026-06-12
      WAN_DATA_INSPECTION: '{"input":"disable","output":"disable"}'
    ports:
      - "127.0.0.1:18080:18080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:18080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
